[pytest]
# === 以下为数据分析层(陈维俊)合入时新增的两处，其余均为团队原有配置，未改动 ===
# 新增1) asyncio_mode = auto：让 async def 测试由 pytest-asyncio 自动接管，
#        无需逐个加 @pytest.mark.asyncio。缺这行时异步测试会在默认 strict 模式下报
#        "async def functions are not natively supported" 而失败。
# 新增2) testpaths 中加入 data_analysis：把数据分析层的测试纳入默认测试范围，
#        否则直接运行 pytest（不带路径）时本层测试会被跳过、不进 CI。
asyncio_mode = auto
pythonpath =
    .
testpaths =
    common
    data_analysis
    execution
    risk_control
    notification
    infrastructure
norecursedirs =
    example
    src
    .git
    .pytest_cache
